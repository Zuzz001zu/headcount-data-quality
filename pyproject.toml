[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "headcount-data-quality"
version = "1.1.0"
description = "Consolidation, quality checks and headcount statistics for HR and payroll data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zara Gadzhieva" }]
dependencies = ["pandas>=2.2", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
headcount = "headcount.cli:main"

[tool.setuptools.packages.find]
include = ["headcount*"]

[tool.setuptools.package-data]
headcount = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# word lists in generate.py read better as split strings
ignore = ["SIM905"]
